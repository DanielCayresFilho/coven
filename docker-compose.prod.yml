version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: coven-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: coven
      MYSQL_USER: coven_user
      MYSQL_PASSWORD: JulianaDaniel@2409!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./coven_backup_20251023.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    networks:
      - coven-network

  backend:
    build:
      context: ./coven
      dockerfile: Dockerfile.prod
    container_name: coven-backend
    restart: always
    ports:
      - "3009:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://coven_user:JulianaDaniel@2409!@db:3306/coven
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-me}
    depends_on:
      - db
    networks:
      - coven-network

  frontend:
    build:
      context: ./covenos-frontend
      dockerfile: Dockerfile.prod
    container_name: coven-frontend
    restart: always
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_URL: http://localhost:3009
    depends_on:
      - backend
    networks:
      - coven-network

networks:
  coven-network:
    driver: bridge

volumes:
  mysql_data:
