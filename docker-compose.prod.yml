version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: coven-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ${MYSQL_INIT_SCRIPT:-./coven_backup_20251023.sql}:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    networks:
      - coven-network

  backend:
    build:
      context: ./coven
      dockerfile: Dockerfile.prod
    container_name: coven-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-3009}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010}
    depends_on:
      - db
    networks:
      - coven-network

  frontend:
    build:
      context: ./covenos-frontend
      dockerfile: Dockerfile.prod
    container_name: coven-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL}
      NUXT_PORT: ${NUXT_PORT:-3000}
    depends_on:
      - backend
    networks:
      - coven-network

networks:
  coven-network:
    driver: bridge

volumes:
  mysql_data:
