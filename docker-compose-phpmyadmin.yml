version: '3.8'

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: coven-phpmyadmin
    environment:
      - PMA_HOST=host.docker.internal
      - PMA_PORT=3306
      - PMA_USER=coven_user
      - PMA_PASSWORD=JulianaDaniel@2409!
      - MYSQL_ROOT_PASSWORD=JulianaDaniel@2409!
    ports:
      - "8082:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"